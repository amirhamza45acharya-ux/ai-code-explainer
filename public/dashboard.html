<!DOCTYPE html>
<html>

<head>
    <title>AI Code Explainer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-size: 16px;
            font-weight: 500;
            color: #2563eb;
        }
        #result-section {
            display: none;
            margin-top: 30px;
        }
        .code-block {
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Code Explainer</h1>

    <p>
        Welcome, <span id="user-display-name">Developer</span> 👋
    </p>

    <hr>

    <h2>Explain & Analyze Your Code</h2>

    <form id="code-form">

        <div class="options">

            <div>
                <label>Programming Language</label>

                <select id="language" required>
                    <option value="">Select Language</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="php">PHP</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="sql">SQL</option>
                </select>
            </div>

            <div>
                <label>Explanation Language</label>

                <select id="explanation_language" required>
                    <option value="">Select Explanation Language</option>
                    <option value="english">English</option>
                    <option value="hindi">Hindi</option>
                    <option value="marathi">Marathi</option>
                    <option value="hinglish">Hinglish</option>
                </select>
            </div>

        </div>

        <div class="editor-layout">

            <div class="editor-box">

                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 10px; gap: 8px;">
                    <h3 style="margin: 0;">Your Code</h3>

                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <input type="file" id="image-upload-input" accept="image/*" style="display: none;">
                        <input type="file" id="camera-capture-input" accept="image/*" capture="environment" style="display: none;">

                        <button type="button" id="btn-upload-img" title="Upload an image or screenshot of your code" style="background: linear-gradient(135deg, #4f46e5, #6366f1); color: white; padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; font-weight: 500; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);">
                            📁 Upload Photo
                        </button>

                        <button type="button" id="btn-camera-img" title="Take a photo of code using your camera" style="background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; padding: 7px 14px; border-radius: 8px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; font-weight: 500; box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);">
                            📸 Take Photo
                        </button>
                    </div>
                </div>

                <!-- Image Scanning Bar / Preview -->
                <div id="image-scan-bar" style="display: none; align-items: center; gap: 12px; background: rgba(79, 70, 229, 0.08); border: 1.5px dashed #6366f1; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;">
                    <img id="image-scan-preview" src="" alt="Scan Preview" style="width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; flex-shrink: 0;">
                    <div style="flex: 1; min-width: 0;">
                        <div id="image-scan-status" style="font-size: 0.9rem; font-weight: 600; color: #4338ca;">
                            🔍 Scanning code from image using AI...
                        </div>
                        <div style="font-size: 0.78rem; color: #64748b; margin-top: 2px;">Extracting syntax, line breaks, and indentation.</div>
                    </div>
                    <button type="button" id="btn-cancel-scan" style="background: transparent; border: none; font-size: 1.3rem; cursor: pointer; color: #ef4444; padding: 4px;" title="Cancel Scan">✕</button>
                </div>

                <textarea
                    id="code"
                    placeholder="Paste your code here, or click 'Upload Photo' / 'Take Photo', or press Ctrl+V to paste a screenshot..."
                    required
                ></textarea>

            </div>

        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
            <button type="button" id="btn-explain" style="flex: 1; min-width: 200px;">
                🤖 Explain Code
            </button>

            <button type="button" id="btn-analyze" style="flex: 1; min-width: 200px; background-color: #0f766e;">
                🔍 Analyze Code for Errors
            </button>
        </div>

    </form>

    <div id="loading" class="loading-spinner">
        ⏳ AI is processing your code... Please wait a moment.
    </div>

    <!-- Result Display Section -->
    <div id="result-section">
        <div class="result-card">
            <h2 id="result-title">AI Output</h2>

            <h3>Your Code</h3>
            <pre class="code-block" id="result-code"></pre>

            <h3 id="result-subtitle">AI Explanation</h3>
            <div class="explanation" id="result-content"></div>
        </div>

        <div class="result-actions" style="margin-top: 20px;">
            <button type="button" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
                ← Explain Another
            </button>
            <a href="history.html">
                <button type="button">
                    History
                </button>
            </a>
        </div>
    </div>

    <br>

    <div style="display: flex; gap: 10px;">
        <a href="history.html">
            <button type="button">
                History
            </button>
        </a>

        <button type="button" onclick="logout()" style="background-color: #ef4444;">
            Logout
        </button>
    </div>

</div>

<script>
// Check Authentication
const userStr = localStorage.getItem('user');
if (!userStr) {
    window.location.href = 'login.html';
}
const user = JSON.parse(userStr || '{}');
document.getElementById('user-display-name').innerText = user.name || 'Developer';

function logout() {
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

// Markdown formatting helper
function formatMarkdown(text) {
    if (!text) return '';
    let formatted = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/^---$/gim, '<hr>')
        .replace(/^\* (.*$)/gim, '• $1')
        .replace(/\n/g, '<br>');
    return formatted;
}

const loadingEl = document.getElementById('loading');
const resultSection = document.getElementById('result-section');
const resultTitle = document.getElementById('result-title');
const resultSubtitle = document.getElementById('result-subtitle');
const resultCode = document.getElementById('result-code');
const resultContent = document.getElementById('result-content');

// 1. EXPLAIN CODE ACTION
document.getElementById('btn-explain').addEventListener('click', async () => {
    const language = document.getElementById('language').value;
    const explanation_language = document.getElementById('explanation_language').value;
    const code = document.getElementById('code').value.trim();

    if (!language || !explanation_language || !code) {
        alert('Please select programming language, explanation language, and enter code.');
        return;
    }

    loadingEl.style.display = 'block';
    loadingEl.innerText = '🤖 Generating AI explanation...';
    resultSection.style.display = 'none';

    try {
        const res = await fetch('/api/ai/explain', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: user.id || user._id,
                language,
                explanation_language,
                code
            })
        });
        const data = await res.json();

        if (data.success && data.explanation) {
            resultTitle.innerText = `AI Code Explanation (${language} in ${explanation_language}) 🤖`;
            resultSubtitle.innerText = 'AI Explanation';
            resultCode.innerText = code;
            resultContent.innerHTML = formatMarkdown(data.explanation);
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        } else {
            alert(data.message || 'Error generating explanation.');
        }
    } catch (err) {
        alert('Network error connecting to AI service.');
    } finally {
        loadingEl.style.display = 'none';
    }
});

// 2. ANALYZE CODE FOR ERRORS ACTION
document.getElementById('btn-analyze').addEventListener('click', async () => {
    const language = document.getElementById('language').value;
    const explanation_language = document.getElementById('explanation_language').value;
    const code = document.getElementById('code').value.trim();

    if (!language || !explanation_language || !code) {
        alert('Please select programming language, explanation language, and enter code.');
        return;
    }

    loadingEl.style.display = 'block';
    loadingEl.innerText = '🔍 Analyzing code for errors and bugs...';
    resultSection.style.display = 'none';

    try {
        const res = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language,
                explanation_language,
                code
            })
        });
        const data = await res.json();

        if (data.success && data.analysis) {
            resultTitle.innerText = `🔍 Code Error Analysis (${language})`;
            resultSubtitle.innerText = 'Analysis Result';
            resultCode.innerText = code;
            resultContent.innerHTML = formatMarkdown(data.analysis);
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        } else {
            alert(data.message || 'Error analyzing code.');
        }
    } catch (err) {
        alert('Network error connecting to AI analysis service.');
    } finally {
        loadingEl.style.display = 'none';
    }
});

// ==========================================
// 3. IMAGE SCANNER & CAMERA OCR HANDLER
// ==========================================
const uploadInput = document.getElementById('image-upload-input');
const cameraInput = document.getElementById('camera-capture-input');
const btnUploadImg = document.getElementById('btn-upload-img');
const btnCameraImg = document.getElementById('btn-camera-img');
const imageScanBar = document.getElementById('image-scan-bar');
const imageScanPreview = document.getElementById('image-scan-preview');
const imageScanStatus = document.getElementById('image-scan-status');
const btnCancelScan = document.getElementById('btn-cancel-scan');
const codeTextarea = document.getElementById('code');
const languageSelect = document.getElementById('language');

let scanAbortController = null;

btnUploadImg.addEventListener('click', () => uploadInput.click());
btnCameraImg.addEventListener('click', () => cameraInput.click());

btnCancelScan.addEventListener('click', () => {
    if (scanAbortController) {
        scanAbortController.abort();
    }
    imageScanBar.style.display = 'none';
    uploadInput.value = '';
    cameraInput.value = '';
});

function handleImageFile(file) {
    if (!file || !file.type.startsWith('image/')) {
        alert('Please choose a valid image file (PNG, JPG, JPEG, WebP).');
        return;
    }

    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64Data = e.target.result;
        imageScanPreview.src = base64Data;
        imageScanBar.style.display = 'flex';
        imageScanStatus.innerText = '🔍 Scanning code from image using AI...';
        imageScanStatus.style.color = '#4338ca';

        try {
            scanAbortController = new AbortController();
            const res = await fetch('/api/ai/scan-image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: base64Data,
                    mime_type: file.type || 'image/jpeg'
                }),
                signal: scanAbortController.signal
            });

            const data = await res.json();
            if (data.success && data.code) {
                codeTextarea.value = data.code;

                // Auto-select detected language
                if (data.language) {
                    const detected = data.language.toLowerCase();
                    const options = Array.from(languageSelect.options);
                    const matched = options.find(opt => opt.value === detected) ||
                                    options.find(opt => detected.includes(opt.value)) ||
                                    options.find(opt => opt.text.toLowerCase().includes(detected));
                    if (matched) {
                        languageSelect.value = matched.value;
                    }
                }

                imageScanStatus.innerText = `✅ Code extracted successfully! (Detected: ${data.language ? data.language.toUpperCase() : 'Code'})`;
                imageScanStatus.style.color = '#15803d';
                codeTextarea.scrollIntoView({ behavior: 'smooth' });

                setTimeout(() => {
                    imageScanBar.style.display = 'none';
                }, 4000);
            } else {
                imageScanStatus.innerText = `❌ ${data.message || 'Could not extract code.'}`;
                imageScanStatus.style.color = '#b91c1c';
            }
        } catch (err) {
            if (err.name !== 'AbortError') {
                imageScanStatus.innerText = '❌ Failed to connect to AI vision scanner.';
                imageScanStatus.style.color = '#b91c1c';
            }
        }
    };
    reader.readAsDataURL(file);
}

uploadInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
        handleImageFile(e.target.files[0]);
    }
});

cameraInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
        handleImageFile(e.target.files[0]);
    }
});

// Clipboard Paste (Ctrl+V) Screenshot Support
window.addEventListener('paste', (e) => {
    const items = (e.clipboardData || e.originalEvent.clipboardData)?.items || [];
    for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (file) {
                handleImageFile(file);
                break;
            }
        }
    }
});

// Drag & drop onto textarea
codeTextarea.addEventListener('dragover', (e) => {
    e.preventDefault();
    codeTextarea.style.border = '2px dashed #4f46e5';
});

codeTextarea.addEventListener('dragleave', () => {
    codeTextarea.style.border = '';
});

codeTextarea.addEventListener('drop', (e) => {
    e.preventDefault();
    codeTextarea.style.border = '';
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleImageFile(e.dataTransfer.files[0]);
    }
});
</script>

</body>

</html>
