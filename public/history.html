<!DOCTYPE html>
<html>

<head>
    <title>Explanation History - AI Code Explainer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .code-block {
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
            font-family: monospace;
        }
        #loading-text {
            text-align: center;
            font-size: 16px;
            color: #64748b;
            margin: 40px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Explanation History</h1>

    <p>Your previous AI code explanations</p>

    <div class="history-actions">
        <a href="dashboard.html">
            <button type="button">← Back to Dashboard</button>
        </a>
    </div>

    <br>

    <div id="loading-text">
        ⏳ Loading your history from MongoDB Atlas...
    </div>

    <div id="history-container"></div>

</div>

<script>
// Check Auth
const userStr = localStorage.getItem('user');
if (!userStr) {
    window.location.href = 'login.html';
}
const user = JSON.parse(userStr || '{}');

function formatMarkdown(text) {
    if (!text) return '';
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/^---$/gim, '<hr>')
        .replace(/\n/g, '<br>');
}

async function loadHistory() {
    const container = document.getElementById('history-container');
    const loading = document.getElementById('loading-text');

    try {
        const userId = user.id || user._id || user.mysql_id;
        const res = await fetch(`/api/history?user_id=${encodeURIComponent(userId)}`);
        const data = await res.json();

        loading.style.display = 'none';

        if (!data.success || !data.explanations || data.explanations.length === 0) {
            container.innerHTML = `
                <div class="empty-history">
                    <h3>No explanations yet</h3>
                    <p>Your saved explanations will appear here.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = data.explanations.map(item => {
            const dateStr = item.created_at ? new Date(item.created_at).toLocaleString() : '';
            return `
                <div class="history-card" id="card-${item.id}">
                    <div class="history-header">
                        <div>
                            <h2>${escapeHtml(item.language || '')}</h2>
                            <p>Explanation: ${escapeHtml(item.explanation_language || '')}</p>
                        </div>
                        <small>${dateStr}</small>
                    </div>

                    <h3>Your Code</h3>
                    <pre class="code-block">${escapeHtml(item.code || '')}</pre>

                    <h3>AI Explanation</h3>
                    <div class="explanation">
                        ${formatMarkdown(item.explanation || '')}
                    </div>

                    <div class="history-footer">
                        <button type="button" class="delete-btn" onclick="deleteHistory('${item.id}')">
                            Delete
                        </button>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        loading.innerText = '❌ Failed to load history from server.';
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
}

async function deleteHistory(id) {
    if (!confirm('Are you sure you want to delete this explanation?')) {
        return;
    }

    try {
        const userId = user.id || user._id || user.mysql_id;
        const res = await fetch(`/api/history/${encodeURIComponent(id)}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();

        if (data.success) {
            const card = document.getElementById(`card-${id}`);
            if (card) card.remove();
        } else {
            alert(data.message || 'Failed to delete explanation.');
        }
    } catch (err) {
        alert('Network error while deleting.');
    }
}

loadHistory();
</script>

</body>
</html>
